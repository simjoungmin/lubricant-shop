spring.application.name=lubricant-shop-back

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/market?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:market}
spring.datasource.password=${DB_PASSWORD:market}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.mariadb.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

server.port=${SERVER_PORT:8080}

jwt.secret=${JWT_SECRET:oil-master-local-development-secret-key-change-me}
jwt.access-token-validity-seconds=${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:7200}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
app.cookie.secure=${COOKIE_SECURE:false}

# Kakao social login
oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
oauth.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
oauth.login-success-redirect-uri=${OAUTH_LOGIN_SUCCESS_REDIRECT_URI:http://localhost:3000}
